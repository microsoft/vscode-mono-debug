name: Extension CI

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
    branches:
    - main
  release:
    types:
    - published

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        submodules: true

    - name: Setup Node
      uses: actions/setup-node@f1f314fca9dfce2769ece7d933488f076716723e # v1.4.6
      with:
        node-version: '18.x'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '8.x'

    - name: Install NPM packages
      run: npm install

    - name: Build VSIX
      run: make

    - name: Set VSIX name variable
      id: vsix_name
      run: echo "::set-output name=filename::$(ls mono-debug-*.vsix)"

    - name: Run tests
      uses: GabrielBB/xvfb-action@f040be23a619e5ec34116f24098ad3626ceab681 # v1.4
      with:
        run: make run-tests

    - name: Upload CI VSIX
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: mono-debug-${{ github.sha }}.vsix
        path: ${{ steps.vsix_name.outputs.filename }}

    - name: Create Release
      if: success() && startsWith(github.ref, 'refs/tags/v')
      id: create_release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release VSIX
      if: success() && startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.vsix_name.outputs.filename }}
        asset_name: ${{ steps.vsix_name.outputs.filename }}
        asset_content_type: application/zip

    - name: Publish to VS Marketplace
      if: success() && startsWith(github.ref, 'refs/tags/v')
      run: make publish
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
