name: Extension CI

on:
  push:
    branches:
    - main
    tags:
    - 'v*'
  pull_request:
    branches:
    - main
  release:
    types:
    - published

permissions:
  contents: write

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '22.x'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '8.x'

    - name: Install NPM packages
      run: npm install

    - name: Build VSIX
      run: make

    - name: Set VSIX name variable
      id: vsix_name
      run: echo "::set-output name=filename::$(ls mono-debug-*.vsix)"

    - name: Run tests
      uses: GabrielBB/xvfb-action@b706e4e27b14669b486812790492dc50ca16b465 # v1.7
      with:
        run: make run-tests

    - name: Upload CI VSIX
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mono-debug-${{ github.sha }}.vsix
        path: ${{ steps.vsix_name.outputs.filename }}

    - name: Create Release
      if: success() && startsWith(github.ref, 'refs/tags/v')
      id: create_release
      uses: actions/create-release@0cb9c9b65d5d1901c1f53e5e66eaf4afd303e70e # v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false

    - name: Upload Release VSIX
      if: success() && startsWith(github.ref, 'refs/tags/v')
      uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5 # v1.0.2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: ${{ steps.vsix_name.outputs.filename }}
        asset_name: ${{ steps.vsix_name.outputs.filename }}
        asset_content_type: application/zip

    - name: Publish to VS Marketplace
      if: success() && startsWith(github.ref, 'refs/tags/v')
      run: make publish
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
